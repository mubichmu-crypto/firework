<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05071a">
<meta name="description" content="생일 축하 불꽃놀이 — 화면을 터치하면 축하 불꽃이 터져요.">
<title>🎂 생일 축하해요! · 불꽃놀이</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden;background:#05071a}
  body{
    position:relative;
    font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(120% 75% at 50% 108%,#1b2a6b 0%,#101a44 26%,#070c24 55%,#040614 100%),
      #040614;
    -webkit-user-select:none;user-select:none;
  }
  #sky{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
  .overlay{
    position:fixed;inset:0;pointer-events:none;z-index:2;
    background:radial-gradient(90% 70% at 50% 45%,rgba(0,0,0,0) 45%,rgba(2,3,12,.55) 100%);
  }

  /* ── 축하 메시지 ───────────────────────────── */
  .hud{
    position:fixed;top:0;left:0;right:0;z-index:3;pointer-events:none;
    padding:calc(env(safe-area-inset-top,0px) + clamp(14px,4.2vw,34px)) 12px 0;
    display:flex;justify-content:center;
  }
  .card{
    width:100%;max-width:min(94vw,600px);
    padding:clamp(13px,3.4vw,20px) clamp(15px,4.2vw,28px) clamp(12px,3vw,18px);
    border-radius:clamp(17px,3.8vw,26px);
    text-align:center;
    background:linear-gradient(180deg,rgba(26,28,72,.40) 0%,rgba(10,12,36,.26) 60%,rgba(8,9,28,.20) 100%);
    border:1px solid rgba(255,226,255,.15);
    -webkit-backdrop-filter:blur(7px) saturate(1.1);
    backdrop-filter:blur(7px) saturate(1.1);
    animation:cardGlow 7s ease-in-out infinite;
  }
  @keyframes cardGlow{
    0%,100%{box-shadow:0 0 46px rgba(120,90,255,.20),inset 0 1px 0 rgba(255,255,255,.08)}
    50%{box-shadow:0 0 74px rgba(255,120,200,.26),inset 0 1px 0 rgba(255,255,255,.12)}
  }
  .kicker{
    margin:0 0 clamp(6px,1.5vw,9px);
    font-size:clamp(8.5px,2.2vw,11.5px);font-weight:800;
    letter-spacing:.20em;line-height:1.4;
    color:rgba(255,222,240,.80);
    text-shadow:0 0 10px rgba(255,140,200,.45);
  }  h1{
    margin:0;
    font-size:clamp(25px,7.2vw,44px);font-weight:900;line-height:1.24;
    letter-spacing:-.6px;color:#fff8f4;
    text-shadow:
      0 0 6px rgba(255,255,255,.65),
      0 0 18px rgba(255,190,230,.55),
      0 0 40px rgba(255,120,195,.42),
      0 0 74px rgba(255,175,90,.28);
    animation:breathe 5.5s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{filter:brightness(1)}
    48%{filter:brightness(1.07)}
    54%{filter:brightness(.99)}
  }
  .sub{
    margin:clamp(7px,2vw,11px) auto 0;max-width:30em;
    font-size:clamp(12px,3.15vw,15.5px);font-weight:600;line-height:1.55;
    letter-spacing:-.2px;color:#e9eeff;word-break:keep-all;text-wrap:balance;
    text-shadow:0 0 12px rgba(140,180,255,.45);
  }
  .hint{
    margin:clamp(8px,2vw,12px) auto 0;
    padding-top:clamp(7px,1.8vw,10px);
    border-top:1px solid rgba(255,255,255,.10);
    max-width:30em;
    font-size:clamp(10.5px,2.9vw,13px);font-weight:600;line-height:1.5;
    letter-spacing:-.1px;color:rgba(203,218,255,.84);word-break:keep-all;
    transition:opacity .9s ease;
  }
  .hint.on{opacity:.48}

  /* ── 버튼 ──────────────────────────────────── */
  .dock{
    position:fixed;left:0;right:0;bottom:0;z-index:4;pointer-events:none;
    padding:0 10px calc(env(safe-area-inset-bottom,0px) + clamp(13px,3.4vw,24px));
    display:flex;justify-content:center;
  }
  .btns{
    display:flex;flex-wrap:wrap;gap:clamp(6px,1.7vw,10px);
    justify-content:center;align-items:center;
    width:100%;max-width:min(96vw,640px);
    pointer-events:none;
  }
  button{
    pointer-events:auto;cursor:pointer;appearance:none;
    font:inherit;font-size:clamp(12px,3.2vw,14.5px);font-weight:800;
    letter-spacing:-.2px;white-space:nowrap;
    padding:clamp(9px,2.5vw,13px) clamp(12px,3.4vw,19px);
    min-height:44px;
    border-radius:999px;
    color:#f3f6ff;
    border:1px solid rgba(255,255,255,.22);
    background:linear-gradient(180deg,rgba(44,48,104,.62) 0%,rgba(14,16,46,.68) 100%);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    box-shadow:0 6px 20px rgba(4,6,20,.45),inset 0 1px 0 rgba(255,255,255,.13);
    transition:transform .12s ease,box-shadow .22s ease,background .22s ease,opacity .22s ease;
    touch-action:manipulation;
  }
  button:hover{background:linear-gradient(180deg,rgba(58,62,126,.70) 0%,rgba(20,22,58,.74) 100%)}
  button:active{transform:scale(.955)}
  button:focus-visible{outline:2px solid rgba(180,220,255,.85);outline-offset:3px}
  button[aria-pressed="false"]{opacity:.66}
  #btnFinale{
    color:#31071a;
    border-color:rgba(255,228,240,.62);
    background:linear-gradient(180deg,#ffa9cf 0%,#ff6f9f 55%,#ff5588 100%);
    box-shadow:0 8px 26px rgba(255,90,150,.40),inset 0 1px 0 rgba(255,255,255,.55);
  }
  #btnFinale:hover{background:linear-gradient(180deg,#ffbcd9 0%,#ff80ac 55%,#ff6594 100%)}

  @media (max-height:600px){
    .card{padding:9px 14px 8px;border-radius:15px}
    h1{font-size:clamp(19px,4.6vw,28px)}
    .sub{font-size:11.5px;margin-top:4px}
    .hint{margin-top:5px;padding-top:5px;font-size:10px}
    .kicker{font-size:8.5px;margin-bottom:4px}
    button{padding:8px 12px;font-size:11.5px;min-height:36px}
  }
  @media (prefers-reduced-motion:reduce){
    h1,.card{animation:none}
  }
</style>
</head>
<body>
  <canvas id="sky" aria-label="생일 축하 불꽃놀이 캔버스"></canvas>
  <div class="overlay"></div>

  <div class="hud">
    <div class="card">
      <p class="kicker">HAPPY BIRTHDAY · A NIGHT FULL OF WISHES</p>
      <h1>🎂 생일 축하해요!</h1>
      <p class="sub">오늘 가장 빛나는 주인공에게 행복과 사랑이 가득한 하루가 되길 ✨</p>
      <p class="hint" id="hint">화면을 터치하면 축하 불꽃이 터져요 · 소리는 첫 터치 후 시작돼요</p>
    </div>
  </div>

  <div class="dock">
    <div class="btns">
      <button type="button" id="btnSound" aria-pressed="true">🔇 소리 끄기</button>
      <button type="button" id="btnAuto" aria-pressed="true">✨ 자동 불꽃 끄기</button>
      <button type="button" id="btnFinale">🎆 크게 터뜨리기</button>
    </div>
  </div>

<script>
(function(){
  'use strict';

  var canvas = document.getElementById('sky');
  var ctx = canvas.getContext('2d');
  var hint = document.getElementById('hint');
  var btnSound = document.getElementById('btnSound');
  var btnAuto = document.getElementById('btnAuto');
  var btnFinale = document.getElementById('btnFinale');

  var W = 0, H = 0, DPR = 1;
  var stars = [], rockets = [], sparks = [];
  var MAX_SPARKS = 5200;
  var PALETTE = ['#ff5f6d','#ff8a3d','#ffd93d','#8affc1','#4ee6ff','#6b8cff','#b46bff','#ff6ec7','#ffffff','#ffb3c7','#ffe98a'];

  function rnd(a,b){ return a + Math.random()*(b-a); }
  function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
  function clamp(v,a,b){ return v < a ? a : (v > b ? b : v); }
  function shuffle(a){
    for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }

  /* ── 오디오 (Web Audio API 직접 합성) ───────── */
  var AC = window.AudioContext || window.webkitAudioContext;
  var audioCtx = null, master = null, noiseBuf = null;
  var soundOn = true;
  var popTimes = [];

  function initAudio(){
    if (audioCtx || !AC) return;
    try { audioCtx = new AC(); } catch(e){ audioCtx = null; return; }
    master = audioCtx.createGain();
    master.gain.value = soundOn ? 0.45 : 0;
    master.connect(audioCtx.destination);
    var len = Math.floor(audioCtx.sampleRate * 1.2);
    noiseBuf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    var d = noiseBuf.getChannelData(0);
    for (var i=0;i<len;i++) d[i] = Math.random()*2 - 1;
  }

  function safe(fn){ try { fn(); } catch(e){} }

  function withAudio(fn){
    if (!soundOn) return;
    initAudio();
    if (!audioCtx || !noiseBuf) return;
    if (audioCtx.state === 'suspended'){
      audioCtx.resume().then(function(){ safe(fn); }, function(){});
    } else {
      safe(fn);
    }
  }

  function noiseSource(){
    var src = audioCtx.createBufferSource();
    src.buffer = noiseBuf;
    src.loop = true;
    return src;
  }

  function outNode(pan){
    if (audioCtx.createStereoPanner){
      var p = audioCtx.createStereoPanner();
      p.pan.value = clamp(pan, -1, 1) * 0.72;
      p.connect(master);
      return p;
    }
    return master;
  }

  // '슈욱~' — 불꽃이 솟아오르는 소리
  function playWhoosh(pan, dur){
    withAudio(function(){
      var t = audioCtx.currentTime;
      var d = clamp(dur || 0.6, 0.34, 0.95);
      var dest = outNode(pan);

      var src = noiseSource();
      var bp = audioCtx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.Q.value = 1.2;
      bp.frequency.setValueAtTime(360, t);
      bp.frequency.exponentialRampToValueAtTime(2100, t + d*0.92);

      var g = audioCtx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.085, t + d*0.55);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);

      src.connect(bp); bp.connect(g); g.connect(dest);
      src.start(t, Math.random()*0.4);
      src.stop(t + d + 0.05);
    });
  }

  // '팡!' — 불꽃이 터지는 소리 (저음 쿵 + 노이즈 파열 + 잔불)
  function playPop(pan, power){
    var nowMs = (window.performance && performance.now) ? performance.now() : Date.now();
    popTimes = popTimes.filter(function(v){ return nowMs - v < 100; });
    if (popTimes.length >= 3) return;
    popTimes.push(nowMs);

    var pw = clamp(power || 1, 0.35, 1.35);
    withAudio(function(){
      var t = audioCtx.currentTime;
      var dest = outNode(pan);

      var osc = audioCtx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(150*pw + 40, t);
      osc.frequency.exponentialRampToValueAtTime(38, t + 0.30);
      var og = audioCtx.createGain();
      og.gain.setValueAtTime(0.0001, t);
      og.gain.exponentialRampToValueAtTime(0.32*pw, t + 0.012);
      og.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
      osc.connect(og); og.connect(dest);
      osc.start(t); osc.stop(t + 0.36);

      var src = noiseSource();
      var hp = audioCtx.createBiquadFilter();
      hp.type = 'highpass';
      hp.frequency.value = 700;
      var ng = audioCtx.createGain();
      ng.gain.setValueAtTime(0.0001, t);
      ng.gain.exponentialRampToValueAtTime(0.26*pw, t + 0.008);
      ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.30);
      src.connect(hp); hp.connect(ng); ng.connect(dest);
      src.start(t, Math.random()*0.4); src.stop(t + 0.32);

      var src2 = noiseSource();
      var bp2 = audioCtx.createBiquadFilter();
      bp2.type = 'bandpass';
      bp2.Q.value = 0.8;
      bp2.frequency.setValueAtTime(3200, t + 0.02);
      bp2.frequency.exponentialRampToValueAtTime(1400, t + 0.55);
      var g2 = audioCtx.createGain();
      g2.gain.setValueAtTime(0.0001, t + 0.02);
      g2.gain.exponentialRampToValueAtTime(0.045*pw, t + 0.07);
      g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.60);
      src2.connect(bp2); bp2.connect(g2); g2.connect(dest);
      src2.start(t + 0.02, Math.random()*0.4); src2.stop(t + 0.62);
    });
  }

  /* ── 화면 ──────────────────────────────────── */
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W*DPR); canvas.height = Math.round(H*DPR);
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    makeStars();
    ctx.clearRect(0,0,W,H);
  }

  function makeStars(){
    var count = Math.round((W*H)/7000);
    count = Math.max(80, Math.min(count, 260));
    stars = [];
    for (var i=0;i<count;i++){
      stars.push({
        x: Math.random()*W,
        y: Math.random()*H*0.94,
        r: rnd(0.4,1.25),
        p: Math.random()*Math.PI*2,
        s: rnd(0.5,1.8),
        b: rnd(0.35,1)
      });
    }
  }

  function drawStars(t){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i=0;i<stars.length;i++){
      var s = stars[i];
      var a = s.b * (0.5 + 0.5*Math.abs(Math.sin(t*0.001*s.s + s.p)));
      if (s.r > 1.0){
        ctx.beginPath();
        ctx.fillStyle = 'rgba(190,215,255,' + (a*0.09).toFixed(3) + ')';
        ctx.arc(s.x, s.y, s.r*2.6, 0, 6.2832);
        ctx.fill();
      }
      ctx.beginPath();
      ctx.fillStyle = 'rgba(255,255,255,' + Math.min(1, a*1.05).toFixed(3) + ')';
      ctx.arc(s.x, s.y, s.r, 0, 6.2832);
      ctx.fill();
    }
    ctx.restore();
  }

  function flash(x, y, radius){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var g = ctx.createRadialGradient(x,y,0,x,y,radius);
    g.addColorStop(0,'rgba(255,255,255,.42)');
    g.addColorStop(0.35,'rgba(255,255,255,.13)');
    g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x,y,radius,0,6.2832); ctx.fill();
    ctx.restore();
  }

  /* ── 모양(하트·별·링) 궤적 ──────────────────── */
  function shapePoints(shape, count){
    var pts = [], i, t, x, y;
    if (shape === 'ring'){
      for (i=0;i<count;i++){ t = (i/count)*6.2832; pts.push([Math.cos(t), Math.sin(t)]); }
      return pts;
    }
    if (shape === 'heart'){
      for (i=0;i<count;i++){
        t = (i/count)*6.2832;
        x = 16*Math.pow(Math.sin(t),3);
        y = 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t);
        pts.push([x, -y]);
      }
    } else {
      var verts = [], a, rad, k, f, A, B, seg;
      for (i=0;i<10;i++){
        a = -Math.PI/2 + i*Math.PI/5;
        rad = (i % 2 === 0) ? 1 : 0.45;
        verts.push([Math.cos(a)*rad, Math.sin(a)*rad]);
      }
      seg = Math.max(4, Math.round(count/10));
      for (i=0;i<verts.length;i++){
        A = verts[i]; B = verts[(i+1) % verts.length];
        for (k=0;k<seg;k++){
          f = k/seg;
          pts.push([A[0] + (B[0]-A[0])*f, A[1] + (B[1]-A[1])*f]);
        }
      }
    }
    // 최대 반경을 1로 맞춰 모양이 그대로 유지되게 한다
    var maxR = 0, L;
    for (i=0;i<pts.length;i++){
      L = Math.sqrt(pts[i][0]*pts[i][0] + pts[i][1]*pts[i][1]);
      if (L > maxR) maxR = L;
    }
    if (maxR > 0){
      for (i=0;i<pts.length;i++){ pts[i][0] /= maxR; pts[i][1] /= maxR; }
    }
    return pts;
  }

  /* ── 발사 · 폭발 ───────────────────────────── */
  function launch(tx, ty, opts){
    opts = opts || {};
    if (ty > H*0.72) ty = H*0.72;
    if (ty < H*0.06) ty = H*0.06;
    var x0 = tx + rnd(-W*0.02, W*0.02);
    var frames = opts.frames || Math.round(rnd(30,44));
    var silent = opts.sound === false;

    rockets.push({
      x: x0, y: H + 8,
      vx: (tx - x0)/frames,
      vy: (ty - (H + 8))/frames,
      left: frames,
      color: opts.color || pick(PALETTE),
      px: x0, py: H + 8,
      size: opts.size || 1,
      shape: opts.shape || null,
      sound: !silent
    });

    if (!silent) playWhoosh((tx/W)*2 - 1, frames/60);
  }

  function burst(x, y, color, opts){
    opts = opts || {};
    var size = opts.size || 1;
    var shape = opts.shape || null;
    var c2 = opts.color2 || pick(PALETTE);
    var baseSpeed = 5.4 + 1.15*size;
    var lifeBase = rnd(56, 80) * (0.92 + 0.30*size);
    var grav = 0.035;
    var vels = [], i, ang, sp, jj, life;

    if (shape){
      // 모양 불꽃: 그 모양을 그대로 확장시킨다
      var pts = shapePoints(shape, 200);
      var disp = Math.min(W*0.26, H*0.28) * (0.62 + 0.22*size);
      var vScale = disp / 34;
      for (i=0;i<pts.length;i++){
        jj = 0.96 + Math.random()*0.08;
        vels.push([pts[i][0]*vScale*jj, pts[i][1]*vScale*jj]);
      }
      lifeBase = rnd(62, 86) * (0.95 + 0.22*size);
      grav = (shape === 'heart') ? 0.012 : 0.010;
    } else {
      var n = Math.round(rnd(105, 152) * Math.min(1.75, size));
      for (i=0;i<n;i++){
        ang = Math.random()*6.2832;
        sp = baseSpeed * (0.24 + Math.pow(Math.random(), 0.5)*0.95);
        vels.push([Math.cos(ang)*sp, Math.sin(ang)*sp]);
      }
    }

    if (sparks.length + vels.length > MAX_SPARKS){
      sparks.splice(0, sparks.length + vels.length - MAX_SPARKS);
    }

    for (i=0;i<vels.length;i++){
      life = Math.round(lifeBase * rnd(0.86, 1.10));
      sparks.push({
        x: x, y: y, px: x, py: y,
        vx: vels[i][0], vy: vels[i][1],
        life: life, max: life,
        color: (!shape && Math.random() < 0.28) ? c2 : color,
        w: rnd(1.3, 2.6) * (size > 1.4 ? 1.12 : 1),
        g: grav,
        drag: shape ? 0.9755 : 0.972
      });
    }

    flash(x, y, 92 * Math.min(2, size));
    if (opts.sound !== false) playPop((x/W)*2 - 1, Math.min(1.3, 0.8*size));
  }

  /* ── 피날레 ────────────────────────────────── */
  var finaleTimers = [];
  function addT(ms, fn){ finaleTimers.push(setTimeout(fn, ms)); }

  function finale(){
    for (var k=0;k<finaleTimers.length;k++) clearTimeout(finaleTimers[k]);
    finaleTimers = [];

    var n = 5 + Math.floor(Math.random()*3);          // 5~7발
    var colors = shuffle(PALETTE.slice());
    var step = 235;
    var i;

    for (i=0;i<n;i++){
      (function(idx){
        addT(140 + idx*step, function(){
          var x = W*(0.14 + 0.72*((idx + 0.5)/n)) + rnd(-W*0.025, W*0.025);
          var y = H*(0.12 + Math.random()*0.22);
          launch(x, y, {
            size: 1.5 + Math.random()*0.55,
            color: colors[(idx*3 + 1) % colors.length],
            frames: Math.round(rnd(34,46))
          });
        });
      })(i);
    }

    // 하트 · 별 · 링 모양 축하 불꽃 (시간차)
    addT(0, function(){
      burst(W*0.5, H*0.50, '#ff8fd0', { shape:'heart', size:2.0, color2:'#ffe3f2' });
    });
    addT(120 + step*1.6, function(){
      burst(W*0.27, H*0.52, '#ffd93d', { shape:'star', size:1.6, color2:'#fff6c9' });
    });
    addT(120 + step*3.2, function(){
      burst(W*0.73, H*0.52, '#4ee6ff', { shape:'ring', size:1.8, color2:'#c8f7ff' });
    });
    addT(120 + step*4.6, function(){
      burst(W*0.5, H*0.62, '#b46bff', { shape:'heart', size:1.5, color2:'#ff9ad5' });
    });
    addT(150 + n*step + 380, function(){
      burst(W*0.5, H*0.44, '#fff3b0', { shape:'ring', size:2.0, color2:'#ff9fd6' });
      burst(W*0.5, H*0.44, '#ffffff', { shape:'star', size:1.2, color2:'#ffd6f0', sound:false });
    });
  }

  /* ── 메인 루프 ─────────────────────────────── */
  function step(t){
    // 흔적을 투명하게 지워 밤하늘 그라데이션이 비치게 한다
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0,0,0,0.21)';
    ctx.fillRect(0,0,W,H);
    ctx.restore();

    drawStars(t);

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';

    var i, r, s;
    for (i = rockets.length - 1; i >= 0; i--){
      r = rockets[i];
      r.px = r.x; r.py = r.y;
      r.x += r.vx; r.y += r.vy; r.left--;
      ctx.strokeStyle = 'rgba(255,240,200,.85)';
      ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.moveTo(r.px, r.py); ctx.lineTo(r.x, r.y); ctx.stroke();
      ctx.strokeStyle = r.color;
      ctx.globalAlpha = .5;
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(r.px, r.py); ctx.lineTo(r.x - r.vx*2.5, r.y - r.vy*2.5); ctx.stroke();
      ctx.globalAlpha = 1;
      if (r.left <= 0){
        burst(r.x, r.y, r.color, { size: r.size, shape: r.shape, sound: r.sound });
        rockets.splice(i,1);
      }
    }

    for (i = sparks.length - 1; i >= 0; i--){
      s = sparks[i];
      s.px = s.x; s.py = s.y;
      s.vx *= s.drag; s.vy *= s.drag;
      s.vy += s.g;
      s.x += s.vx; s.y += s.vy;
      s.life--;
      if (s.life <= 0 || s.y > H + 40){
        sparks.splice(i,1);
        continue;
      }
      var a = s.life / s.max;
      ctx.globalAlpha = Math.max(0, Math.min(1, Math.pow(a, 1.35)*1.35));
      ctx.strokeStyle = s.color;
      ctx.lineWidth = s.w * (0.35 + a*0.8);
      ctx.beginPath(); ctx.moveTo(s.px, s.py); ctx.lineTo(s.x, s.y); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    requestAnimationFrame(step);
  }

  /* ── 자동 불꽃 ─────────────────────────────── */
  var autoOn = true;
  var autoTimer = null;

  function scheduleAuto(){
    if (autoTimer) clearTimeout(autoTimer);
    if (!autoOn) return;
    autoTimer = setTimeout(function(){
      if (!document.hidden && sparks.length < MAX_SPARKS*0.6 && rockets.length < 5){
        launch(rnd(W*0.14, W*0.86), rnd(H*0.10, H*0.45));
      }
      scheduleAuto();
    }, rnd(900, 2400));
  }

  function updateSound(){
    btnSound.textContent = soundOn ? '🔇 소리 끄기' : '🔊 소리 켜기';
    btnSound.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
    if (master && audioCtx){
      master.gain.setTargetAtTime(soundOn ? 0.45 : 0, audioCtx.currentTime, 0.03);
    }
  }

  function updateAuto(){
    btnAuto.textContent = autoOn ? '✨ 자동 불꽃 끄기' : '✨ 자동 불꽃 켜기';
    btnAuto.setAttribute('aria-pressed', autoOn ? 'true' : 'false');
  }

  /* ── 입력 ──────────────────────────────────── */
  var firstTouch = false;

  function onPoint(x, y){
    launch(x, y);
    if (!firstTouch){
      firstTouch = true;
      hint.classList.add('on');
    }
  }

  canvas.addEventListener('pointerdown', function(e){
    if (e.cancelable) e.preventDefault();
    onPoint(e.clientX, e.clientY);
  });

  // 첫 제스처에서 오디오를 깨운다 (브라우저 자동재생 정책)
  document.addEventListener('pointerdown', function(){
    initAudio();
    if (audioCtx && audioCtx.state === 'suspended'){
      var p = audioCtx.resume();
      if (p && p.catch) p.catch(function(){});
    }
  }, true);

  btnSound.addEventListener('click', function(){
    soundOn = !soundOn;
    initAudio();
    if (soundOn && audioCtx && audioCtx.state === 'suspended'){
      var p = audioCtx.resume();
      if (p && p.catch) p.catch(function(){});
    }
    updateSound();
    if (soundOn) setTimeout(function(){ playPop(0, 0.55); }, 40);
  });

  btnAuto.addEventListener('click', function(){
    autoOn = !autoOn;
    updateAuto();
    if (autoOn) scheduleAuto();
    else if (autoTimer) clearTimeout(autoTimer);
  });

  btnFinale.addEventListener('click', function(){
    finale();
  });

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function(){
    setTimeout(resize, 260);
  });

  updateSound();
  updateAuto();
  resize();
  requestAnimationFrame(step);
  setTimeout(function(){
    launch(W*0.5, H*0.34);
    scheduleAuto();
  }, 700);
})();
</script>
</body>
</html>
